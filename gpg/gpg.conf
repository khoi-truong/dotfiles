# ~/.gnupg/gpg.conf — copied in by gpg/setup.sh (not a symlink: gpg is strict
# about ~/.gnupg permissions and refuses to follow some links).
#
# Declarative, non-secret hardening only. Keys, ownertrust and trustdb are
# never versioned.

# Show a full 16-char key ID and the fingerprint.
keyid-format 0xlong
with-fingerprint

# Don't leak the gpg/libgcrypt version or a comment into signatures.
no-emit-version
no-comments

# Prefer strong algorithms when creating keys / signatures.
personal-cipher-preferences AES256 AES192 AES
personal-digest-preferences SHA512 SHA384 SHA256
personal-compress-preferences ZLIB BZIP2 ZIP Uncompressed
default-preference-list SHA512 SHA384 SHA256 AES256 AES192 AES ZLIB BZIP2 ZIP Uncompressed
cert-digest-algo SHA512
s2k-digest-algo SHA512
s2k-cipher-algo AES256

# Cross-certify subkey signatures; refuse weak digests.
require-cross-certification
weak-digest SHA1

# Always show long key IDs and UIDs even for expired/revoked entries.
list-options show-uid-validity
verify-options show-uid-validity
