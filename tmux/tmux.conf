# ~/.tmux.conf (symlink to $DOTFILES/tmux/tmux.conf)
#
# Tuned for running several Claude Code agents side by side: one agent per
# pane, tiled, each pane labelled, long scrollback, layouts that survive a
# reboot. Plugins are managed by tpm and bootstrap themselves on first launch
# (see the bottom of this file).

# --- prefix --------------------------------------------------------------------
# Ctrl+A, like screen. Press it twice to send a literal Ctrl+A.
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# --- general ------------------------------------------------------------------
set -g mode-keys vi
set -g mouse on
set -sg escape-time 0           # no delay for the Esc key (matters in nvim)
set -g focus-events on          # let nvim/agents know when their pane is focused
set -g history-limit 100000     # agents are verbose; keep a deep scrollback
set -g display-time 2000        # keep status messages up long enough to read
set -g set-clipboard on
set -g detach-on-destroy off    # closing a session drops to the next, not the shell

# True colour. The outer terminal must also advertise it (iTerm2 does).
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"

# Windows and panes count from 1; renumber so there are never gaps.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Only shrink a window to the smallest client if that client is actually
# looking at it — lets a phone/tablet peek without squashing the layout.
setw -g aggressive-resize on

# --- reload -----------------------------------------------------------------
unbind r
bind r source-file ~/.tmux.conf \; display "reloaded ~/.tmux.conf"

# --- panes: splitting & navigation -----------------------------------------
# Split keeping the current directory. | and - are easier to remember.
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# vim-tmux-navigator provides C-h/j/k/l across tmux panes and vim splits.
# prefix h/j/k/l still works as a fallback.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize: prefix + Shift-arrow, repeatable.
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# --- multi-agent helpers --------------------------------------------------
# Tile every pane evenly — the default agent layout.
bind Space select-layout tiled

# Label a pane with the agent/task running in it (shown in the border).
bind A command-prompt -p "pane title:" "select-pane -T '%%'"

# Broadcast the same keystrokes to every pane in the window (e.g. send one
# prompt to all agents, or Ctrl-C them together). Toggle off with the same key.
bind S set-window-option synchronize-panes \; \
  display "synchronize-panes #{?synchronize-panes,ON,OFF}"

# Move a pane out to its own window, or pull one back in.
bind b break-pane -d
bind @ choose-window "join-pane -h -s '%%'"

# Scratch shell in a popup — quick lookups without disturbing the layout.
bind g display-popup -E -w 80% -h 80% -d "#{pane_current_path}"

# Jump between sessions (one per project) as a zoomed tree.
bind s choose-tree -Zs

# --- copy mode (vi) ------------------------------------------------------------
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe "pbcopy"
bind Enter copy-mode

# --- status bar -------------------------------------------------------------
set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-justify left

set -g status-style "bg=#1e1e2e,fg=#a6adc8"
set -g status-left-length 40
set -g status-right-length 120

# Left: session name, and a bold marker when synchronize-panes is on.
set -g status-left "#[fg=#1e1e2e,bg=#89b4fa,bold] #S #[fg=#89b4fa,bg=#1e1e2e]#{?pane_synchronized,#[fg=#f38ba8]  SYNC ,} "

# Right: pane count · git branch · host · time.
set -g status-right "#[fg=#6c7086]#{window_panes} panes #[fg=#6c7086]· #[fg=#a6adc8]#(cd #{pane_current_path} && git symbolic-ref --short HEAD 2>/dev/null) #[fg=#6c7086]· #[fg=#a6adc8]#h #[fg=#6c7086]· #[fg=#1e1e2e,bg=#89b4fa,bold] %H:%M "

setw -g window-status-format " #I:#W#{?window_zoomed_flag,  ,} "
setw -g window-status-current-format "#[fg=#1e1e2e,bg=#a6e3a1,bold] #I:#W#{?window_zoomed_flag,  ,} "
setw -g window-status-separator ""

# --- pane borders ----------------------------------------------------------
# Show each pane's title (set with `prefix A`) on its top border so you can
# tell agents apart at a glance.
set -g pane-border-status top
set -g pane-border-format " #{?pane_active,#[fg=#a6e3a1#,bold],#[fg=#6c7086]}#P #{pane_title} "
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#a6e3a1"

set -g message-style "bg=#89b4fa,fg=#1e1e2e"

# --- plugins (tpm) -------------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# resurrect/continuum: keep agent layouts and their scrollback across restarts.
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '10'

# Bootstrap tpm on first launch, then hand off to it.
if "test ! -d ~/.tmux/plugins/tpm" \
  "run 'git clone -q https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"
run "~/.tmux/plugins/tpm/tpm"
