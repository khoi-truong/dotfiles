# Reusable (workflow_call only). Called by pi.yml and smoke.yml.
name: Detect Changes

on:
  workflow_call:
    outputs:
      pi:
        description: "'true' when the pi extensions or their version pins changed"
        value: ${{ jobs.detect-changes.outputs.pi }}
      macos:
        description: "'true' when anything the macOS smoke test exercises changed"
        value: ${{ jobs.detect-changes.outputs.macos }}

permissions: {}

jobs:
  detect-changes:
    name: Detect changed paths
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # paths-filter lists the PR's files through the API
    outputs:
      # Push to main (or a manual run) always runs everything.
      pi: ${{ github.event_name != 'pull_request' || steps.changed.outputs.pi == 'true' }}
      macos: ${{ github.event_name != 'pull_request' || steps.changed.outputs.macos == 'true' }}
    steps:
      - name: Detect changed paths
        id: changed
        if: github.event_name == 'pull_request' # API-based; no checkout
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            pi:
              - 'ai/pi/**'
              - 'mise/global.toml'
              - '.github/workflows/pi.yml'
              - '.github/workflows/_detect-changes.yml'
            macos:
              - 'zsh/**'
              - 'ai/aliases.zsh'
              - 'ai/claude/providers.zsh'
              - 'setup.sh'
              - 'lib/**'
              - '**.plist'
              - '.github/workflows/smoke.yml'
              - '.github/workflows/_detect-changes.yml'
