# Reusable (workflow_call only). Called by smoke.yml and test.yml.
name: Detect Changes

on:
  workflow_call:
    outputs:
      macos:
        description: "'true' when anything the macOS smoke test exercises changed"
        value: ${{ jobs.detect-changes.outputs.macos }}
      herdr:
        description: "'true' when anything the herdr test suite reads changed"
        value: ${{ jobs.detect-changes.outputs.herdr }}

permissions: {}

jobs:
  detect-changes:
    name: Detect changed paths
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # paths-filter lists the PR's files through the API
    outputs:
      # Push to main (or a manual run) always runs everything.
      macos: ${{ github.event_name != 'pull_request' || steps.changed.outputs.macos == 'true' }}
      herdr: ${{ github.event_name != 'pull_request' || steps.changed.outputs.herdr == 'true' }}
    steps:
      - name: Detect changed paths
        id: changed
        if: github.event_name == 'pull_request' # API-based; no checkout
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            macos:
              - 'zsh/**'
              # ai/ and git/ are the modules smoke.yml's setup re-run step
              # exercises — the two whose setup.sh only writes under $HOME — so
              # a change to what they link changes that step's result. This
              # subsumes the narrower ai/aliases.zsh and ai/claude/providers.zsh
              # that used to be listed here.
              - 'ai/**'
              - 'git/**'
              - 'setup.sh'
              - 'lib/**'
              - '**.plist'
              - '.github/workflows/smoke.yml'
              - '.github/workflows/_detect-changes.yml'
            herdr:
              - 'ai/herdr/**'
              - 'lib/**'
              - '.github/workflows/test.yml'
              - '.github/workflows/_detect-changes.yml'
