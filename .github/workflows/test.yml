name: Tests
run-name: "${{ github.workflow }} · ${{ github.event.pull_request.title || github.event.head_commit.message }}"

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  detect-changes:
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/_detect-changes.yml

  herdr:
    name: Run herdr tests
    needs: detect-changes
    if: needs.detect-changes.outputs.herdr == 'true'
    # macOS, because team.sh calls `require_macos` from lib/common.sh and exits 0
    # without running a verb anywhere else: on Linux the cases that assert output
    # would fail against a script that had already left, and the ones that assert
    # an exit code would pass against a no-op — red for the runner's OS instead
    # of red for the branch. Free while this repo is public; 10x the Linux rate
    # if it goes private, which is why the gate above keeps it off PRs that do
    # not touch what it tests. smoke.yml pays the same price for the same reason.
    runs-on: macos-15
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # Case 131 reads a commit behind `main`, so the runner needs history
          # and not just the tip. `main` itself does not come with it — see the
          # step below.
          fetch-depth: 0
          persist-credentials: false

      # `wt_add` in ai/herdr/tests/run.sh cuts its throwaway worktrees from a
      # branch named `main`, and case 131 reads an ancestor of it. A PR checkout
      # is a detached merge commit with no local branch, so without this the
      # suite finds no base to cut from: nine cases skip, and under
      # HERDR_TESTS_STRICT the run fails on them — correctly, but for a
      # precondition the job can supply in one line.
      - name: Create the main branch the suite cuts from
        run: git rev-parse --verify --quiet refs/heads/main >/dev/null || git branch main origin/main

      - name: Verify git, python3 and zsh are on PATH
        run: |
          for tool in git python3 zsh; do
            command -v "$tool" >/dev/null || {
              echo "::error title=Missing tool::$tool is not on PATH"
              exit 1
            }
          done

      # Strict: a skip is a case that did not run. The runner supplies git and
      # the tools above, so the only skips left are the two the suite declares —
      # 45's live herdr pane, which no fixture run has, and 10's pty, which a
      # runner was never promised. Every other skip fails case 132, which is
      # what stops a green job from standing in for a guard nobody asked.
      - name: Run the herdr test suite
        env:
          HERDR_TESTS_STRICT: "1"
        run: bash ai/herdr/tests/run.sh

  nvim:
    name: Run Neovim IDE test
    needs: detect-changes
    if: needs.detect-changes.outputs.nvim == 'true'
    # Linux: nothing in the config or its test needs macOS.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Neovim
        uses: rhysd/action-setup-vim@febef33995d6649302e9d88dda81e071b68f16a7 # v1.6.1
        with:
          neovim: true
          version: stable

      # Throwaway XDG directories, with the repo's config linked in as
      # ~/.config/nvim would be.
      - name: Create the XDG directories
        run: |
          mkdir -p "$RUNNER_TEMP/xdg/config"
          ln -s "$GITHUB_WORKSPACE/nvim" "$RUNNER_TEMP/xdg/config/nvim"
          {
            echo "XDG_CONFIG_HOME=$RUNNER_TEMP/xdg/config"
            echo "XDG_DATA_HOME=$RUNNER_TEMP/xdg/data"
            echo "XDG_STATE_HOME=$RUNNER_TEMP/xdg/state"
            echo "XDG_CACHE_HOME=$RUNNER_TEMP/xdg/cache"
          } >>"$GITHUB_ENV"

      - name: Restore plugins from the lockfile
        run: nvim --headless "+Lazy! restore" +qa

      # Full mode: every check must run. A `skip` line means a plugin check did
      # not, so it fails the job like a `FAIL` line does.
      - name: Run the Neovim IDE test
        run: |
          rc=0
          nvim --headless -l nvim/tests/ide.lua | tee "$RUNNER_TEMP/ide.out" || rc=$?
          if grep -q '^skip' "$RUNNER_TEMP/ide.out"; then
            echo "::error title=Skipped checks::the IDE test skipped checks in full mode"
            rc=1
          fi
          exit "$rc"

      # HERDR_ENV=1 disables some plugins by cond; the lockfile must still match.
      - name: Run the Neovim IDE test under herdr
        env:
          HERDR_ENV: "1"
        run: |
          rc=0
          nvim --headless -l nvim/tests/ide.lua | tee "$RUNNER_TEMP/ide-herdr.out" || rc=$?
          if grep -q '^skip' "$RUNNER_TEMP/ide-herdr.out"; then
            echo "::error title=Skipped checks::the IDE test skipped checks in full mode"
            rc=1
          fi
          exit "$rc"

      - name: Verify the lockfile is unchanged
        run: git diff --exit-code nvim/lazy-lock.json

  python:
    name: Run herdr Python tests
    needs: detect-changes
    if: needs.detect-changes.outputs.herdr == 'true'
    # Linux, unlike the job above: the unit tests read `ai/herdr/lib/` and
    # `ai/herdr/tests/`, which are standard-library Python, and `team.sh` — the
    # only thing that needs macOS — is not involved. ruff and mypy over the same
    # files are lint.yml's `python` job.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Same install as lint.yml's `python` job; the rationale is there.
      - name: Set up uv
        env:
          UV_VERSION: "0.12.10"
        run: |
          pipx install "uv==${UV_VERSION}"
          echo "$HOME/.local/bin" >>"$GITHUB_PATH"

      # Keyed on this file's hash because this file holds the pytest pin.
      - name: Cache uv downloads
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('.github/workflows/test.yml') }}-${{ github.sha }}
          restore-keys: |
            uv-${{ runner.os }}-${{ hashFiles('.github/workflows/test.yml') }}-
            uv-${{ runner.os }}-

      # From `ai/herdr`, where `pyproject.toml` puts `lib/` on the path. The suite
      # above is the end-to-end half and does not run here — it needs macOS.
      - name: Run the Python unit tests
        working-directory: ai/herdr
        run: uvx pytest@9.1.1
