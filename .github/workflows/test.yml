name: Tests
run-name: "${{ github.workflow }} · ${{ github.event.pull_request.title || github.event.head_commit.message }}"

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  detect-changes:
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/_detect-changes.yml

  herdr:
    name: Run herdr tests
    needs: detect-changes
    if: needs.detect-changes.outputs.herdr == 'true'
    # macOS, because team.sh calls `require_macos` from lib/common.sh and exits 0
    # without running a verb anywhere else: on Linux the cases that assert output
    # would fail against a script that had already left, and the ones that assert
    # an exit code would pass against a no-op — red for the runner's OS instead
    # of red for the branch. Free while this repo is public; 10x the Linux rate
    # if it goes private, which is why the gate above keeps it off PRs that do
    # not touch what it tests. smoke.yml pays the same price for the same reason.
    runs-on: macos-15
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # Case 131 reads a commit behind `main`, so the runner needs history
          # and not just the tip. `main` itself does not come with it — see the
          # step below.
          fetch-depth: 0
          persist-credentials: false

      # `wt_add` in ai/herdr/tests/run.sh cuts its throwaway worktrees from a
      # branch named `main`, and case 131 reads an ancestor of it. A PR checkout
      # is a detached merge commit with no local branch, so without this the
      # suite finds no base to cut from: nine cases skip, and under
      # HERDR_TESTS_STRICT the run fails on them — correctly, but for a
      # precondition the job can supply in one line.
      - name: Create the main branch the suite cuts from
        run: git rev-parse --verify --quiet refs/heads/main >/dev/null || git branch main origin/main

      - name: Verify git, python3 and zsh are on PATH
        run: |
          for tool in git python3 zsh; do
            command -v "$tool" >/dev/null || {
              echo "::error title=Missing tool::$tool is not on PATH"
              exit 1
            }
          done

      # Strict: a skip is a case that did not run. The runner supplies git and
      # the tools above, so the only skips left are the two the suite declares —
      # 45's live herdr pane, which no fixture run has, and 10's pty, which a
      # runner was never promised. Every other skip fails case 132, which is
      # what stops a green job from standing in for a guard nobody asked.
      - name: Run the herdr test suite
        env:
          HERDR_TESTS_STRICT: "1"
        run: bash ai/herdr/tests/run.sh

  python:
    name: Check the herdr Python
    needs: detect-changes
    if: needs.detect-changes.outputs.herdr == 'true'
    # Linux, unlike the job above: the four checks below read `ai/herdr/lib/`
    # and `ai/herdr/tests/`, which are standard-library Python, and `team.sh` —
    # the only thing that needs macOS — is not involved in any of them. The gate
    # is the same one that job uses, because the filter it reads covers the same
    # files; nothing here is worth a run on a PR that cannot have changed them.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # uv comes from mise on a laptop; a runner has no mise, so it is installed
      # here. `pipx` because this repo's CI already runs a pinned Python tool that
      # way (lint.yml's zizmor), and because `astral-sh/setup-uv` would be one
      # more third-party action to review and keep current — against three lines
      # that do the same job with no action at all. (This repo already trusts
      # `dorny/paths-filter`, so it is not the first; the point is that a
      # toolchain this small does not need the indirection.) This pin is uv's own
      # and is the only one here that scripts/ci/lint-local.sh does not mirror: it
      # has mise. The three below are that script's pins, and the four uvx lines
      # are that script's four commands, verbatim.
      - name: Set up uv
        env:
          UV_VERSION: "0.12.10"
        run: |
          pipx install "uv==${UV_VERSION}"
          echo "$HOME/.local/bin" >>"$GITHUB_PATH"

      # Four cold `uvx` invocations per run download ruff, mypy, pytest and their
      # dependencies into `~/.cache/uv`, which a fresh runner does not have. The
      # key is this file's own hash because this file is where the four pins live:
      # bumping one is exactly the change that has to miss, and the restore-keys
      # below re-use the other three tools' layers while it does. `actions/*` pins
      # to a major tag here by policy (zizmor.yml's ref-pin for trusted
      # publishers), the same as the checkouts above.
      - name: Cache uv downloads
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('.github/workflows/test.yml') }}-${{ github.sha }}
          restore-keys: |
            uv-${{ runner.os }}-${{ hashFiles('.github/workflows/test.yml') }}-
            uv-${{ runner.os }}-

      # From `ai/herdr`: ruff, mypy and pytest all read `pyproject.toml` from
      # the directory they are run in, and that is where it is.
      - name: Check for Python lint findings
        working-directory: ai/herdr
        run: uvx ruff@0.16.8 check .

      - name: Verify Python files are formatted
        working-directory: ai/herdr
        run: uvx ruff@0.16.8 format --check .

      # `--with pytest` because the tests import it, and an import mypy cannot
      # resolve makes the test function under each decorator untyped — which
      # would put the tests outside `strict` to spare them a dependency they do
      # not have at runtime. That is also why `ai/herdr/pyproject.toml` carries
      # no `ignore_missing_imports` for pytest: the fix is here, not there.
      - name: Verify the Python types are clean
        working-directory: ai/herdr
        run: uvx --with pytest==9.1.1 mypy@2.3.1 --strict

      # The unit tests for the two modules `team.sh` imports. The suite above is
      # the end-to-end half and does not run here — it needs macOS.
      - name: Run the Python unit tests
        working-directory: ai/herdr
        run: uvx pytest@9.1.1
