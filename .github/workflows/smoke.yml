name: Smoke Test
run-name: "${{ github.workflow }} · ${{ github.event.pull_request.title || github.event.head_commit.message }}"

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  detect-changes:
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/_detect-changes.yml

  macos:
    name: Start the shell on macOS
    needs: detect-changes
    if: needs.detect-changes.outputs.macos == 'true'
    # Free for public repos; the only job that runs the config on its real OS.
    runs-on: macos-15
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # ~350 ms locally; hosted runners are slower and noisier.
      MAX_STARTUP_MS: 1500
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify plists are well-formed
        run: git ls-files -z '*.plist' | xargs -0 plutil -lint -s

      - name: Verify setup.sh runs on macOS
        run: ./setup.sh --list

      # zshenv hardcodes ~/.dotfiles, so point a throwaway HOME at the checkout.
      - name: Set up a throwaway home
        run: |
          home="${RUNNER_TEMP}/home"
          mkdir -p "$home"
          ln -s "$GITHUB_WORKSPACE" "$home/.dotfiles"
          ln -s "$GITHUB_WORKSPACE/zsh/zshenv" "$home/.zshenv"
          ln -s "$GITHUB_WORKSPACE/zsh/zshrc" "$home/.zshrc"
          echo "SMOKE_HOME=$home" >>"$GITHUB_ENV"

      # The first start clones antidote and the plugins (progress goes to
      # stderr) and builds every cache. `exit 0`: a bare `exit` returns the
      # status of zshrc's last line, which is legitimately false.
      - name: Set up plugins and caches with a first shell
        run: HOME="$SMOKE_HOME" zsh -i -c 'exit 0'

      - name: Verify a warm shell starts quickly and without errors
        run: |
          for _ in 1 2 3; do HOME="$SMOKE_HOME" zsh -i -c 'exit 0' >/dev/null 2>>"$RUNNER_TEMP/stderr.log"; done
          if [[ -s $RUNNER_TEMP/stderr.log ]]; then
            cat "$RUNNER_TEMP/stderr.log"
            exit 1
          fi
          best=
          for _ in 1 2 3 4 5; do
            start=$(perl -MTime::HiRes=time -e 'printf "%d", time * 1000')
            HOME="$SMOKE_HOME" zsh -i -c 'exit 0' >/dev/null 2>&1
            ms=$(( $(perl -MTime::HiRes=time -e 'printf "%d", time * 1000') - start ))
            if [[ -z $best ]] || (( ms < best )); then best=$ms; fi
          done
          echo "Fastest warm start: ${best} ms (limit ${MAX_STARTUP_MS} ms)"
          echo "### Shell startup: ${best} ms" >>"$GITHUB_STEP_SUMMARY"
          if (( best > MAX_STARTUP_MS )); then
            echo "::error title=Shell startup::${best} ms is over ${MAX_STARTUP_MS} ms"
            exit 1
          fi

      # setup.sh is the other half of "this config works on a new machine": it
      # is what a fresh machine runs, so running it again has to be safe. Only
      # modules audited to write nothing outside $HOME run here — git/ and ai/,
      # the two whose setup.sh does nothing but link files under $HOME and
      # shell out to a tool it checks for first. misc/ was dropped because it
      # reaches misc/stats/setup.sh, which runs `defaults import`; brew/,
      # mise/, macos/, iterm/ and terminal/ drive brew, mise, sudo or
      # `defaults write`. setup.sh's own prelude still runs — brew detection,
      # the sudo keep-alive and the six shell links are all no-ops on a runner
      # that has brew, passwordless sudo and a $HOME this step owns.
      #
      # The snapshot is paths, link targets and file bytes, deliberately not
      # mtimes: `git config` rewrites gitconfig.local on every run, so an
      # mtime-aware snapshot would call a correct re-run a change.
      - name: Set up the safe modules twice under the throwaway home
        run: |
          snapshot() {
            python3 -c '
          import hashlib, os, sys

          root = sys.argv[1]
          rows = []
          for dirpath, dirnames, filenames in os.walk(root):
              dirnames.sort()
              for name in sorted(dirnames + filenames):
                  path = os.path.join(dirpath, name)
                  rel = os.path.relpath(path, root)
                  if os.path.islink(path):
                      rows.append("l %s -> %s" % (rel, os.readlink(path)))
                  elif os.path.isdir(path):
                      rows.append("d %s" % rel)
                  else:
                      with open(path, "rb") as handle:
                          rows.append("f %s %s" % (
                              rel, hashlib.sha256(handle.read()).hexdigest()))
          for row in sorted(rows):
              print(row)
          ' "$SMOKE_HOME" >"$1"
          }

          HOME="$SMOKE_HOME" ./setup.sh git ai
          snapshot "$RUNNER_TEMP/home.1"
          HOME="$SMOKE_HOME" ./setup.sh git ai
          snapshot "$RUNNER_TEMP/home.2"

      - name: Verify the second run left the throwaway home unchanged
        run: |
          # diff first: a red build has to name what the second run changed.
          if diff -u "$RUNNER_TEMP/home.1" "$RUNNER_TEMP/home.2" >"$RUNNER_TEMP/home.diff"; then
            echo "The two runs produced an identical throwaway home."
          else
            head -40 "$RUNNER_TEMP/home.diff"
            echo "::error title=setup.sh is not idempotent::the second run changed the throwaway home; see the diff above"
            exit 1
          fi

          # Never follow a symlink: $SMOKE_HOME links to the checkout, and
          # walking it would test the repository instead of what setup linked.
          python3 -c '
          import os, sys

          home, workspace = sys.argv[1], os.path.realpath(sys.argv[2])
          bad = []
          for dirpath, dirnames, filenames in os.walk(home):
              dirnames.sort()
              for name in sorted(dirnames + filenames):
                  path = os.path.join(dirpath, name)
                  if not os.path.islink(path):
                      continue
                  real = os.path.realpath(path)
                  if real != workspace and not real.startswith(workspace + os.sep):
                      bad.append("%s -> %s" % (os.path.relpath(path, home), real))
          if bad:
              print("These symlinks under the throwaway home do not resolve into")
              print("the checkout, so they would dangle on a real machine:")
              for row in bad:
                  print("  " + row)
              sys.exit(1)
          print("Every symlink under the throwaway home resolves into the checkout.")
          ' "$SMOKE_HOME" "$GITHUB_WORKSPACE"
