name: Lint
run-name: "${{ github.workflow }} · ${{ github.event.pull_request.title || github.event.head_commit.message }}"

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.png"
      - "**.tiff"
      - "**.icns"
      - "**.plist"
      - "**.xib"
      - "**.storyboard"
  push:
    branches: [main]
    paths-ignore:
      - "**.png"
      - "**.tiff"
      - "**.icns"
      - "**.plist"
      - "**.xib"
      - "**.storyboard"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

# Every tool version pinned in this file — markdownlint-cli2, actionlint,
# zizmor, editorconfig-checker, ruff and mypy — is mirrored in scripts/ci/lint-local.sh,
# along with the two scripts/ci/check-*.sh below. The two files are the only
# places these are named, so bump them in the same change: a pin that
# disagrees is a green local run that CI then fails.
jobs:
  scripts:
    name: Lint shell and zsh scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Cheapest step first: this is a grep over the checkout, so a CLAUDE.md
      # rule violation is reported before shellcheck has read a script.
      - name: Check for CLAUDE.md rule violations
        run: bash scripts/ci/check-rules.sh

      - name: Verify shell scripts pass shellcheck
        run: |
          files=()
          while IFS= read -r file; do files+=("$file"); done < <(scripts/ci/list-shell-scripts.sh)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No shell scripts found."
            exit 0
          fi
          shellcheck -x "${files[@]}"

      - name: Set up zsh
        run: sudo apt-get update -qq && sudo apt-get install -y zsh

      - name: Verify zsh files parse
        run: |
          files=()
          while IFS= read -r file; do files+=("$file"); done < <(git ls-files '*.zsh' zsh/zshrc zsh/zshenv)
          # `zsh -n a b` parses only `a` and treats `b` as a positional
          # parameter, so each file needs its own invocation. Run them all and
          # keep going so one failed run names every unparseable file.
          rc=0
          for file in "${files[@]}"; do
            zsh -n "$file" || rc=1
          done
          exit "$rc"

  docs-and-config:
    name: Lint docs and config files
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check for markdown lint findings
        run: |
          files=()
          while IFS= read -r file; do files+=("$file"); done < <(git ls-files '*.md')
          npx --yes markdownlint-cli2@0.23.2 "${files[@]}"

      - name: Set up editorconfig-checker
        run: |
          curl -fsSL -o ec.tar.gz https://github.com/editorconfig-checker/editorconfig-checker/releases/download/v4.0.1/editorconfig-checker-linux-amd64.tar.gz
          echo "90139c6ed52373c0acfc9deb2a07aa812e5184753afd4bc8252bf44eb4909155  ec.tar.gz" | sha256sum -c -
          tar -xzf ec.tar.gz editorconfig-checker
          sudo install -m 755 editorconfig-checker /usr/local/bin/ec

      # Markdown tables are hand-wrapped and don't align on multiples of 2
      # (see .markdownlint-cli2.jsonc MD013/MD060); gitconfig, plists and
      # vendored Xcode templates use their own tab/format conventions.
      - name: Check for editorconfig violations
        run: >
          ec -exclude
          '\.md$|\.plist$|\.xccolortheme$|\.terminal$|^git/gitconfig$|^xcode/templates/'

      - name: Verify JSON files are valid
        run: |
          files=()
          while IFS= read -r file; do files+=("$file"); done < <(git ls-files '*.json' | grep -v -E '^vscode/(settings|keybindings)\.json$')
          for file in "${files[@]}"; do
            jq empty "$file"
          done

      - name: Verify TOML files are valid
        run: |
          git ls-files -z '*.toml' | xargs -0 python3 -c '
          import sys, tomllib
          for path in sys.argv[1:]:
              with open(path, "rb") as f:
                  tomllib.load(f)
          '

      - name: Check for malformed or duplicate brew/Brewfile entries
        run: bash scripts/ci/check-brewfile.sh

      # Removing a line from brew/Brewfile uninstalls nothing by itself — but
      # `brew/setup.sh --cleanup` runs `brew bundle cleanup`, which uninstalls
      # everything the file does not list. Say so on the PR that removes it,
      # while the removal is still one revert away. Last in the job because it
      # is the one step here that needs the network.
      - name: Report brew/Brewfile entries removed by this pull request
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail

          # "type name" per entry, quotes removed and any parens dropped, in a
          # stable order. The same entry types, the same optional `brew("name")`
          # parens and the same two quote styles as
          # scripts/ci/check-brewfile.sh, so the two agree on what an entry is.
          # Validating the line is that script's job, and it runs earlier in
          # this job, so a malformed one never reaches here.
          pairs() {
            local entry_types='tap|brew|cask|mas|vscode|whalebrew|go|cargo|uv'
            sed -nE \
              -e "s/^[[:space:]]*(${entry_types})[[:space:]]*[(]?\"([^\"]+)\"[)]?.*/\1 \2/p" \
              -e "s/^[[:space:]]*(${entry_types})[[:space:]]*[(]?'([^']+)'[)]?.*/\1 \2/p" \
              | sort -u
          }

          git fetch --no-tags --depth=1 origin "$BASE_REF"
          if ! git show "FETCH_HEAD:brew/Brewfile" >"$RUNNER_TEMP/Brewfile.base" 2>/dev/null; then
            echo "No brew/Brewfile on $BASE_REF — nothing to compare against."
            exit 0
          fi

          removed="$(comm -23 \
            <(pairs <"$RUNNER_TEMP/Brewfile.base") \
            <(pairs <brew/Brewfile))"
          [ -n "$removed" ] || exit 0

          # One line: a workflow command cannot carry a raw newline.
          echo "::warning title=Brewfile entries removed::$(printf '%s' "$removed" | tr '\n' ' ')"
          {
            echo "### brew/Brewfile entries removed by this pull request"
            echo
            echo "brew bundle cleanup — which brew/setup.sh --cleanup runs —"
            echo "uninstalls anything absent from brew/Brewfile. Confirm each of"
            echo "these is meant to go:"
            echo
            echo '```'
            printf '%s\n' "$removed"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

  workflows:
    name: Lint GitHub Actions workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check for workflow lint findings
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color

      - name: Check for workflow security findings
        run: pipx run zizmor==1.30.1 --persona=regular .github/workflows

  python:
    name: Lint Python files
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # uv comes from mise on a laptop; a runner has no mise, so it is installed
      # here. `pipx` because this file already runs a pinned Python tool that way
      # (zizmor, above), and `astral-sh/setup-uv` would be one more third-party
      # action to review and keep current for what three lines do. This pin is
      # uv's own and the one scripts/ci/lint-local.sh does not mirror: it has mise.
      # test.yml's `python` job installs uv the same way.
      - name: Set up uv
        env:
          UV_VERSION: "0.12.10"
        run: |
          pipx install "uv==${UV_VERSION}"
          echo "$HOME/.local/bin" >>"$GITHUB_PATH"

      # Keyed on this file's hash because this file holds the ruff and mypy pins:
      # bumping one is exactly the change that has to miss, and the restore-keys
      # re-use the other tool's layers while it does. `actions/*` pins to a major
      # tag by policy (zizmor.yml's ref-pin for trusted publishers).
      - name: Cache uv downloads
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: uv-lint-${{ runner.os }}-${{ hashFiles('.github/workflows/lint.yml') }}-${{ github.sha }}
          restore-keys: |
            uv-lint-${{ runner.os }}-${{ hashFiles('.github/workflows/lint.yml') }}-
            uv-lint-${{ runner.os }}-

      # From `ai/herdr`: ruff and mypy read `pyproject.toml` from the directory
      # they are run in, and that is where it is.
      - name: Check for Python lint findings
        working-directory: ai/herdr
        run: uvx ruff@0.16.8 check .

      - name: Verify Python files are formatted
        working-directory: ai/herdr
        run: uvx ruff@0.16.8 format --check .

      # `--with pytest` because the tests import it, and an import mypy cannot
      # resolve makes the test function under each decorator untyped — which
      # would put the tests outside `strict`. That is why
      # `ai/herdr/pyproject.toml` carries no `ignore_missing_imports` for pytest.
      - name: Verify the Python types are clean
        working-directory: ai/herdr
        run: uvx --with pytest==9.1.1 mypy@2.3.1 --strict

      # Nothing above reads a module the way the interpreter that will run it
      # does. `team.sh` calls whatever `python3` is on PATH, which on macOS is
      # `/usr/bin/python3` — 3.9 — and an alias is an assignment: `State =
      # tuple[str, str | None, str]` is evaluated at import, where `|` is a
      # TypeError on 3.9, so every verb importing that module exits 1 without
      # running. `from __future__ import annotations` defers annotations and
      # nothing else. mypy@2.3.1 refuses to target below 3.10, so it cannot
      # stand in for this either.
      #
      # The whole package, through `pkgutil` rather than a list of names, so a
      # module added later is covered without a second edit. `providers` is
      # imported on top of that because it is not in the package — it sits
      # beside it on the same PYTHONPATH — and because importing it is what
      # takes the 3.9 half of the tomllib import, which is the branch this step
      # exists for: 3.9 has no `tomllib`, and the fallback is a vendored parser
      # that nothing else here reads. Last in the job because it is the only
      # step that fetches an interpreter; uv caches it after the first run.
      - name: Verify the modules import under Python 3.9
        working-directory: ai/herdr
        run: |
          PYTHONPATH=lib uv run --no-project --python 3.9 python -c '
          import pkgutil
          import herdr_team
          import providers

          for name in sorted(m.name for m in pkgutil.iter_modules(herdr_team.__path__)):
              __import__("herdr_team." + name)
          '
