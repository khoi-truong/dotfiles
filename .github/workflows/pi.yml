name: Pi Extensions
run-name: "${{ github.workflow }} · ${{ github.event.pull_request.title || github.event.head_commit.message }}"

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/_detect-changes.yml

  check:
    name: Check pi extensions
    needs: detect-changes
    if: needs.detect-changes.outputs.pi == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ai/pi/package-lock.json

      - name: Install dev dependencies
        run: npm ci --ignore-scripts
        working-directory: ai/pi

      # tsc, eslint, then the gate, path, hook and vendored-drift tests
      - name: Verify pi extensions typecheck, lint and pass tests
        run: npm run check
        working-directory: ai/pi
