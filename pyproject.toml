[project]
name = "dotfiles"
version = "0"
requires-python = ">=3.11"

[dependency-groups]
dev = ["pytest==9.1.1"]

# mise owns Python: use the interpreter it put on PATH, never fetch another.
[tool.uv]
python-preference = "only-system"
python-downloads = "never"

[tool.pyright]
venvPath = "."
venv = ".venv"
executionEnvironments = [
  { root = "ai/herdr", extraPaths = ["ai/herdr/lib", "ai/claude"] },
]

# lib/ and tests/ at the repo root run under the system python3 that macOS
# ships (3.9), unlike ai/herdr, which has its own config and a 3.11 floor.
[tool.ruff]
target-version = "py39"
extend-exclude = ["ai"]
# ai/claude/providers.py is linted by name from ai/herdr (CI) and reads TOML with
# tomllib, a 3.11 module; without this it is sorted as a third-party import.
per-file-target-version = { "ai/claude/providers.py" = "py311" }

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["lib", "tests", "scripts/ci/hygiene.py", "scripts/gen-policy.py", "ai/herdr/plugins.py"]
# tests/test_providers.py imports ai/claude/providers.py, a 3.11 reader; ai/herdr's
# mypy config (3.11) checks both.
exclude = ["tests/test_providers\\.py"]

[tool.pytest.ini_options]
pythonpath = ["ai/claude"]
