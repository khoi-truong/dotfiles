# Global defaults, linked to ~/.config/mise/config.toml. Project pins
# (mise.toml, .tool-versions, .*-version files, go.mod) always win.
#
# Named global.toml because mise would load <dir>/mise/config.toml a second
# time as a project config in every shell under ~/.dotfiles.

[tools]
python = "3.14"
node   = "lts"
ruby   = "3.4"
go     = "1.27"
rust   = "stable"
java   = "temurin-25"   # mise exports JAVA_HOME

pdm = "latest"
uv  = "latest"          # don't use `uv python`; mise owns Python

"go:golang.org/x/tools/gopls" = "latest"

"npm:@mariozechner/pi-coding-agent" = "latest"

swiftformat = "latest"
swiftlint   = "latest"

[settings]
idiomatic_version_file_enable_tools = ["python", "ruby", "node", "java", "go"]

[settings.python]
# Bare "3.x" otherwise picks the freethreaded stripped build, which fails to install.
precompiled_flavor = "install_only"
