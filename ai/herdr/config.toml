# herdr — terminal workspace manager for coding agents.
# Linked to ~/.config/herdr/config.toml by ai/setup.sh.
# Defaults: `herdr --default-config`. Apply edits: `herdr server reload-config`.

# Onboarding ran once; do not show it again.
onboarding = false

[theme]
# Matches the iTerm2 Gruvbox preset and omp's dark-gruvbox.
name = "gruvbox"

[update]
# Homebrew owns the binary (brew/Brewfile). `herdr update` would fight it, so
# don't nag about new versions; the agent-detection manifest still updates.
version_check = false

[ui]
# Distinct static glyphs for blocked / working / done / idle instead of
# color-only dots, so a row still reads where the theme's colors sit close.
status_indicators = "symbols"

# One pane per agent (README), so put the agent on its split border rather than
# making the sidebar the only place that says who is where.
show_agent_labels_on_pane_borders = true

# The layout here is workspace → panes; the tab level is unused. Navigation is
# already two-dimensional (prefix+shift+N picks the repo, prefix+alt+N the
# agent row), so a tab row showing one auto-named tab was a line of chrome
# saying "1". Hidden, not disabled: a second tab brings the row back, which is
# what a dev server or a test watcher would want.
hide_tab_bar_when_single_tab = true

[ui.toast]
# iTerm2 raises a real macOS notification, so a finished agent is visible from
# another window. Requires iTerm2 > Settings > Profiles > Terminal >
# "Send notifications".
delivery = "terminal"

[ui.sound]
enabled = true

# Sidebar rows. `$*` tokens come from the usagebar plugin (plugins.list), the
# rest are herdr built-ins.
#
# `$title` replaces herdr's built-in tab/pane tokens, which render blank while
# a tab still has its auto-assigned number. It resolves to the workspace label,
# which is per-agent for a crew pane (crew.sh labels the workspace) but shared
# by every pane a tab holds — so it names the *place*, not the agent.
#
# `terminal_title_stripped` is what names the agent. Claude Code keeps the
# terminal title as a live summary of what it is doing ("Herdr config PR"), so
# it is both the only token that separates two panes in one tab and the only
# one that says anything about the work. Dimmed: it is the subtitle of the row
# above, not a second heading.
#
# `$provider` is deliberately absent. It reports the detected agent kind, which
# is `claude` on every pane here — including a `ccd` one, whose status line
# says `DS·deepseek-flash`. It cannot see the cc/ccd split, so it was a
# constant word costing a third of the sidebar width on every row.
#
# `$limit` and `$context` share a row because they are one thought (what this
# pane has left) and together fit the width. Note `$limit` is the Pro 5h/7d
# window even on a DeepSeek pane: Claude Code reports no limits over a custom
# endpoint and usagebar falls back to the last Pro reading.
#
# The `$cache_*` tokens are deliberately absent. They report this pane's
# prompt-cache hit rate and the expiry of its cached prefix, which is real
# per-pane data but not actionable: nothing you would do about "ttl≈8m"
# differs from what you would do about "ttl≈60m", short of sending filler to
# keep it warm. It cost a row and 25 columns to say so.
[ui.sidebar.agents]
# One blank line between agents; gap 0 ran the entries together.
row_gap = 1
rows = [
  ["state_icon", "$title"],
  [{ token = "terminal_title_stripped", dim = true }],
  ["$limit", "$context"],
]

[session]
# Resume claude/omp conversations after a server restart. Needs the
# integrations installed by ai/setup.sh.
resume_agents_on_restore = true

[keys]
# One workspace per repository (README): a repo is one prefix+shift+N away, and
# prefix+alt+N lands on the Nth agent row.
switch_workspace = "prefix+shift+1..9"
focus_agent = "prefix+alt+1..9"

# Diff review in a popup, the equivalent of tmux's `prefix g` scratch popup
# (tmux/tmux.conf). lazygit is already in brew/Brewfile.
[[keys.command]]
key = "prefix+alt+g"
type = "popup"
command = "lazygit"
width = "90%"
height = "90%"

# Crew roster and outstanding handoffs at a glance. `zsh -ic` because crew.sh
# is read through the repo, not $PATH, and `read -k` holds the popup open.
[[keys.command]]
key = "prefix+alt+c"
type = "popup"
command = "zsh -ic '~/.dotfiles/ai/herdr/crew.sh status; read -k'"
width = "70%"
height = "50%"

# Agent Usage (usagebar). Single chords, deliberately outside prefix mode: a
# quota check is a glance, not a command. Neither collides with the prefix
# bindings above.
[[keys.command]]
key = "ctrl+shift+u"
type = "plugin_action"
command = "usagebar.open-limits"
description = "Agent Usage: open limits pane"

[[keys.command]]
key = "ctrl+shift+m"
type = "plugin_action"
command = "usagebar.refresh"
description = "Agent Usage: refresh sidebar meters"

[experimental]
# Keep pane screen history across a full server restart, so a restarted server
# brings back the scrollback behind the conversations that
# session.resume_agents_on_restore already resumes.
pane_history = true

# Prefix mode swaps the macOS input source for an ASCII-capable layout and
# restores it on exit, so prefix commands still register under a Vietnamese IME.
switch_ascii_input_source_in_prefix = true
