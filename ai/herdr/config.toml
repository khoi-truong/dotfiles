# herdr — terminal workspace manager for coding agents.
# Linked to ~/.config/herdr/config.toml by ai/setup.sh.
# Defaults: `herdr --default-config`. Apply edits: `herdr server reload-config`.

# Onboarding ran once; do not show it again.
onboarding = false

[theme]
# Matches the iTerm2 Gruvbox preset and omp's dark-gruvbox.
name = "gruvbox"

[update]
# Homebrew owns the binary (brew/Brewfile). `herdr update` would fight it, so
# don't nag about new versions; the agent-detection manifest still updates.
version_check = false

[ui]
# Distinct static glyphs for blocked / working / done / idle instead of
# color-only dots, so a row still reads where the theme's colors sit close.
status_indicators = "symbols"

# One pane per agent (README), so put the agent on its split border rather than
# making the sidebar the only place that says who is where.
show_agent_labels_on_pane_borders = true

# The layout here is workspace → panes; the tab level is unused. Navigation is
# already two-dimensional (prefix+shift+N picks the repo, prefix+alt+N the
# agent row), so a tab row showing one auto-named tab was a line of chrome
# saying "1". Hidden, not disabled: a second tab brings the row back, which is
# what a dev server or a test watcher would want.
hide_tab_bar_when_single_tab = true

[ui.toast]
# iTerm2 raises a real macOS notification, so a finished agent is visible from
# another window. Requires iTerm2 > Settings > Profiles > Terminal >
# "Send notifications".
delivery = "terminal"

[ui.sound]
enabled = true

# Sidebar rows. `$*` tokens come from the usagebar plugin (plugins.list), the
# rest are herdr built-ins.
#
# `workspace` and `tab` are the built-ins, and they say different things:
# team.sh labels the workspace after the agent and the tab after its branch.
# They get a line each rather than sharing one. herdr joins tokens on a row
# with `·` and has no separator setting, so `exec-1 · feat/team-json` put two
# identities of different kinds on one line and truncated the branch first —
# and a branch is the one field where the tail (`…/team-json`) is what
# distinguishes it. Stacked, the name is the heading and the branch is a full
# line of its own.
#
# usagebar's `$title` was here first, because a tab keeping its auto-assigned
# number renders the built-in `tab` blank. That is no longer reachable:
# team.sh names the tab it creates, and `prompt_new_tab_name` (herdr's
# default) asks for a name on a hand-made one. `$title` was also not
# deterministic — it resolved to the tab label on one pane and the workspace
# label on another — and it is cached, so it lagged a rename until the plugin
# next refreshed.
#
# `terminal_title_stripped` is what names the agent. Claude Code keeps the
# terminal title as a live summary of what it is doing ("Herdr config PR"), so
# it is both the only token that separates two panes in one tab and the only
# one that says anything about the work. Dimmed: it is the subtitle of the row
# above, not a second heading.
#
# `$provider` is what says which billing identity a pane is on. It reports the
# quota provider on a subscription pane (`claude`) and the backend actually
# billed on a pay-as-you-go one, so a `ccd` pane reads `deepseek · Σ 425k
# $0.04` where a `cc` pane reads `claude · 5h 60%`. That is the cc/ccd split
# the sidebar could not show before, and the reason the row is worth its
# width; `$limit`'s Pro-window fallback is no longer the only thing on it.
#
# `$limit` is the shortest provider window (`5h 60%`) on a subscription pane
# and the session burn on its backend on a pay-as-you-go one. Shortest is not
# a setting: the plugin takes the minimum window it has and formats one, so
# the 7d number cannot reach this sidebar. It is in the Agent Usage pane
# (ctrl+shift+u), the status line, and ~/.claude/cache/pro-quota.json.
#
# No row carries an icon of its own. herdr rejects a literal in `rows`
# (`unknown sidebar token; custom tokens must start with $`) and keeps the
# previous settings, so a glyph has to be baked into a token's value by
# whoever publishes it — the plugin for `$*`, or `herdr pane report-metadata
# --token` for one of ours. `state_icon` and `$context`'s ⛁ are the only two.
#
# The `$cache_*` trio is one row: the plugin sets exactly one of high/mid/low
# by the session hit rate, so listing all three renders a single value in the
# band's colour. Gruvbox yellow below 80%, red below 50% — the number only
# matters when it is bad, and a red `cache hit 35.0% · ttl≈20m` is the cue to
# stop growing the prefix and let it rotate. The TTL only appears when the
# plugin has a recorded expiry.
[ui.sidebar.agents]
# One blank line between agents; gap 0 ran the entries together.
row_gap = 1
rows = [
  ["state_icon", "workspace"],
  ["tab"],
  [{ token = "terminal_title_stripped", dim = true }],
  ["$provider", "$limit"],
  [
    "$cache_high",
    { token = "$cache_mid", fg = "#fabd2f" },
    { token = "$cache_low", fg = "#fb4934" },
  ],
  ["$context"],
]

[session]
# Resume claude/omp conversations after a server restart. Needs the
# integrations installed by ai/setup.sh.
resume_agents_on_restore = true

[keys]
# One workspace per repository (README): a repo is one prefix+shift+N away, and
# prefix+alt+N lands on the Nth agent row.
switch_workspace = "prefix+shift+1..9"
focus_agent = "prefix+alt+1..9"

# A worktree is a workspace in herdr, so `New worktree` (prefix+shift+g, a
# default) mints a fresh space every time it is pressed — correct for a new
# branch, a duplicate for one that already has a checkout. `Open worktree...`
# is the one that reuses: it lists the repo's checkouts and focuses the space
# an open one already has. herdr leaves it unbound, which is why the duplicates
# were the only path anyone found.
open_worktree = "prefix+shift+o"

# Diff review in a popup, the equivalent of tmux's `prefix g` scratch popup
# (tmux/tmux.conf). lazygit is already in brew/Brewfile.
[[keys.command]]
key = "prefix+alt+g"
type = "popup"
command = "lazygit"
width = "90%"
height = "90%"

# Team roster and outstanding handoffs at a glance. `zsh -ic` because team.sh
# is read through the repo, not $PATH, and `read -k` holds the popup open.
[[keys.command]]
key = "prefix+alt+t"
type = "popup"
command = "zsh -ic '~/.dotfiles/ai/herdr/team.sh status; read -k'"
width = "70%"
height = "50%"

# Agent Usage (usagebar). Single chords, deliberately outside prefix mode: a
# quota check is a glance, not a command. Neither collides with the prefix
# bindings above.
[[keys.command]]
key = "ctrl+shift+u"
type = "plugin_action"
command = "usagebar.open-limits"
description = "Agent Usage: open limits pane"

[[keys.command]]
key = "ctrl+shift+m"
type = "plugin_action"
command = "usagebar.refresh"
description = "Agent Usage: refresh sidebar meters"

[worktrees]
# Where `New worktree` puts a checkout. herdr's default is ~/.herdr/worktrees;
# `git wta` (git/gitconfig) has always used ~/.worktrees. The rest of the
# layout below the root is already identical — <repo>/<branch with / as ->,
# and the repo name comes out `.dotfiles` on both sides — so pointing herdr at
# the same root makes the two produce the *same* directory for a branch
# instead of two checkouts that only look alike. That is what lets
# `Open worktree...` find a tree `git wta` made, and vice versa.
directory = "~/.worktrees"

[experimental]
# Keep pane screen history across a full server restart, so a restarted server
# brings back the scrollback behind the conversations that
# session.resume_agents_on_restore already resumes.
pane_history = true

# Prefix mode swaps the macOS input source for an ASCII-capable layout and
# restores it on exit, so prefix commands still register under a Vietnamese IME.
switch_ascii_input_source_in_prefix = true
